[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "channel-py"
version = "0.1.0"
description = "Python implementation of Channel with client, server, and process transports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dmitry Kozlov" }]
dependencies = [
  "orjson>=3.10.0",
  "websockets>=15.0.1",
  "uvloop>=0.22.1; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/channel_py"]
